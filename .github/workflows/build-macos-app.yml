name: Build macOS App

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Fetch LVGL (managed component not in git)
        run: |
          mkdir -p firmware/managed_components
          git clone --depth 1 https://github.com/lvgl/lvgl.git firmware/managed_components/lvgl__lvgl
          cd firmware/managed_components/lvgl__lvgl
          git fetch --depth 1 origin 85aa60d18b3d5e5588d7b247abf90198f07c8a63
          git checkout 85aa60d18b3d5e5588d7b247abf90198f07c8a63

      - name: Build static simulator
        run: |
          cd simulator
          cmake -B build-static -DSTATIC_SDL2=ON
          cmake --build build-static
          # Verify no SDL2 dynamic dependency
          otool -L build-static/agent-pets-sim > /tmp/otool-out.txt
          if grep -qi sdl /tmp/otool-out.txt; then
            echo "ERROR: SDL2 dynamic dependency found"
            cat /tmp/otool-out.txt
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: host
        run: |
          pip install -r requirements.txt
          pip install py2app

      - name: Generate app icon
        working-directory: host
        run: |
          mkdir -p AppIcon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size agent_pets_menubar/icons/crab-connected.png \
              --out AppIcon.iconset/icon_${size}x${size}.png
          done
          for size in 16 32 64 128 256; do
            double=$((size * 2))
            sips -z $double $double agent_pets_menubar/icons/crab-connected.png \
              --out "AppIcon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns AppIcon.iconset -o AppIcon.icns
          rm -rf AppIcon.iconset

      - name: Build .app with py2app
        working-directory: host
        run: python setup.py py2app

      - name: Bundle simulator into app
        run: |
          cp simulator/build-static/agent-pets-sim "host/dist/Agent Pets.app/Contents/MacOS/"

      - name: Create DMG
        working-directory: host
        run: |
          mkdir -p dmg-staging
          cp -R "dist/Agent Pets.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Agent Pets" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "dist/Agent-Pets.dmg"
          rm -rf dmg-staging

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v7
        with:
          name: Agent-Pets-macOS
          path: host/dist/Agent-Pets.dmg

      - name: Upload DMG to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: host/dist/Agent-Pets.dmg
