<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" shape-rendering="crispEdges">
  <style>
    .fox { transform-origin: 8px 15px; animation: breathe 2.8s steps(2,end) infinite }
    .tail { transform-origin: 13px 12px; animation: wag 2s steps(3,end) infinite alternate }
    .blink { transform-origin: 6px 7px; animation: blink 5s steps(1,end) infinite }
    .prop, .sleep { display: none }
    [data-pose="resting"] .fox { transform: translateY(3px) scaleY(.78); animation: none }
    [data-pose="resting"] .blink { display: none }
    [data-pose="resting"] .sleep { display: inline }
    [data-pose="editing"] .sew, [data-pose="inspecting"] .glass, [data-pose="researching"] .glass,
    [data-pose="executing"] .gear, [data-pose="external"] .signal, [data-pose="coordinating"] .signal,
    [data-pose="working"] .ponder, [data-pose="compacted"] .broom { display: inline }
    [data-pose="question"] .fox, [data-pose="approval"] .fox { animation: look 1.8s steps(2,end) infinite }
    [data-pose="failure"] .fox, [data-pose="interrupted"] .fox, [data-pose="setback"] .fox { animation: tilt .6s steps(3,end) infinite alternate }
    [data-pose="completed"] .fox { animation: hop .55s steps(4,end) infinite }
    .sew, .broom, .gear { animation: work .65s steps(2,end) infinite alternate }
    @keyframes breathe { 50% { transform: scaleY(.94) } }
    @keyframes wag { to { transform: rotate(-12deg) } }
    @keyframes blink { 94%,98% { transform: scaleY(1) } 96% { transform: scaleY(.2) } }
    @keyframes work { to { transform: translate(1px,-1px) } }
    @keyframes hop { 50% { transform: translateY(-4px) } }
    @keyframes look { 50% { transform: translateY(-1px) rotate(-4deg) } }
    @keyframes tilt { to { transform: rotate(7deg) } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0s !important } }
  </style>
  <path fill="#1a2831" opacity=".28" d="M0 15h18v1H0z"/>
  <g class="fox">
    <g class="tail">
      <path fill="#A44B39" d="M10 10h5V8h3V5h4v6h-2v3h-4v1h-6z"/>
      <path fill="#E48345" d="M11 10h5V8h3V5h3v5h-3v2h-4v1h-4z"/>
      <path fill="#FFD7A0" d="M19 4h3V3h1v5h-2v2h-2z"/>
    </g>
    <path fill="#A44B39" d="M3 8h9v4h2v3h-3v-2H6v2H3z"/>
    <path fill="#E48345" d="M3 8h8v3h2v2H3z"/>
    <path fill="#FFD7A0" d="M3 8h4v3H5v1H3z"/>
    <path fill="#E48345" d="M0 0h1v1h2v2h5V2h2V0h2v7h1v2h-2v1H7v1H4v-1H1V9h-2V7H0z"/>
    <path fill="#A44B39" d="M1 1h1v2h1v1H1zm9 2h1V1h1v3h-2z"/>
    <path fill="#FFD7A0" d="M-1 7h3v1h2v1h3V8h2V7h4v2h-2v1H8v1H4v-1H1V9h-2z"/>
    <path class="blink" fill="#29313c" d="M2 5h1v2H2zm6 0h1v2H8z"/>
    <path class="sleep" fill="#29313c" d="M1 6h2v1H1zm7 0h2v1H8z"/>
    <path fill="#29313c" d="M4 8h3v1H4z"/>
    <g class="prop sew"><path fill="#46968e" d="M-5 12h9v3h-9z"/><path fill="#f4dc85" d="M-4 12h2v1h-2zm4 0h2v1H0z"/><path stroke="#536170" stroke-width=".7" d="m-2 12 3-5"/></g>
    <g class="prop glass"><path fill="#6fced1" stroke="#304957" d="M-5 6h4v4h-4z"/><path fill="#304957" d="M-1 10h1v1h1v1H0v-1h-1z"/></g>
    <g class="prop gear" fill="#536170"><path d="M-5 10h2v1h2v1h1v2h-2v1h-3v-1h-1v-3h1z"/><path fill="#f5d795" d="M-4 12h2v1h-2z"/></g>
    <path class="prop signal" stroke="#66cbc2" fill="none" d="M-3 5V3h2m-5 2V1h4m-7 4v-6h6"/>
    <path class="prop ponder" fill="#f2d98b" d="M-2 0h2v2h-2zm-3-4h3v3h-3z"/>
    <g class="prop broom"><path stroke="#805449" d="m0 8-4 6"/><path fill="#e6be68" d="M-6 12h3v3h-4z"/></g>
  </g>
</svg>
