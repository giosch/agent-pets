[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-pets-habitat"
version = "0.1.0a1"
description = "A local browser pet habitat for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]

[project.optional-dependencies]
usb = ["pyserial>=3.5,<4"]
bluetooth = ["bleak>=3.1,<4", "hidapi>=0.15,<0.16"]

[project.scripts]
agent-pets = "agent_pets_habitat.cli:main"

[tool.hatch.build.targets.sdist]
include = ["/host/habitat.py", "/host/agent_pets_habitat", "/host/agent_pets_daemon/__init__.py",
           "/host/agent_pets_daemon/protocol.py", "/host/agent_pets_daemon/session_store.py",
           "/assets/habitat", "/assets/svg-animations"]

[tool.hatch.build.targets.wheel]
packages = ["host/agent_pets_habitat"]

[tool.hatch.build.targets.wheel.force-include]
"host/habitat.py" = "agent_pets_habitat/cli.py"
"host/agent_pets_daemon/__init__.py" = "agent_pets_daemon/__init__.py"
"host/agent_pets_daemon/protocol.py" = "agent_pets_daemon/protocol.py"
"host/agent_pets_daemon/session_store.py" = "agent_pets_daemon/session_store.py"
"assets/habitat" = "agent_pets_habitat/assets/habitat"
"assets/svg-animations" = "agent_pets_habitat/assets/svg-animations"
