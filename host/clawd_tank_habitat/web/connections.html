<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connections · Clawd Tank</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/habitat.css">
<script type="module" src="/connections.js"></script></head>
<body><header class="mast"><div class="mast-inner"><div class="brand"><img src="/favicon.svg" width="32" alt="">Clawd Tank</div><a href="/">Open habitat</a></div></header>
<main class="connections"><h1>Connections</h1><p id="status" role="status">Checking host…</p>
<p id="hint" hidden>Open Clawd Tank from your applications to change settings.</p>
<section class="agent-list" id="agents" aria-label="Coding agents"></section>
<section class="desktop-prefs"><label><input type="checkbox" id="login"> Start when I sign in</label>
<div class="actions"><button id="finish">Open habitat</button><button id="updates">Check for updates</button><a id="download" hidden rel="noreferrer">Download update</a><button id="stop">Stop host</button></div></section>
<details id="uninstaller" hidden><summary>Uninstall Clawd Tank</summary>
<p>Uninstalling removes the application, its hooks, and sign-in startup.</p>
<label><input type="checkbox" id="purge"> Also erase saved sessions and installed artwork</label>
<div class="actions"><button id="uninstall">Uninstall from this account</button></div></details>
<p id="feedback" role="status"></p></main></body></html>
