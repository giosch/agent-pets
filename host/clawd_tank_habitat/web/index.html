<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2e9">
  <title>Pet habitat · Clawd Tank</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/habitat.css">
  <script type="module" src="/habitat.js"></script>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="s-question" viewBox="0 0 16 16"><path d="M4 2h7v2h2v4h-2v2H9v1H7V8h2V6h2V4H5v2H3V4h1zm3 11h2v2H7z"/></symbol>
    <symbol id="s-approval" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M5 1h6v2h2v4h1v8H2V7h1V3h2zm1 2v1H5v3h6V4h-1V3zm1 6v3h2V9z"/></symbol>
    <symbol id="s-ready" viewBox="0 0 16 16"><path d="M12 3h3v3h-2v2h-2v2H9v2H7v2H5v-2H3v-2H1V7h3v2h2v1h1V8h2V6h2V4h1z"/></symbol>
    <symbol id="s-failure" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M6 1h4v2h2v2h2v3h1v5h-2v2H3v-2H1V8h1V5h2V3h2zm1 3v5h2V4zm0 7v2h2v-2z"/></symbol>
    <symbol id="s-overflow" viewBox="0 0 16 16"><path d="M1 1h8v2H3v6H1zm4 4h8v2H7v6H5zm4 4h7v7H9z"/></symbol>
    <symbol id="s-helpers" viewBox="0 0 16 16"><path d="M3 2h5v4H3zm7 2h4v4h-4zM1 8h8v5H1zm9 2h5v4h-5z"/></symbol>
  </svg>
  <header class="mast"><div class="mast-inner">
    <div class="brand"><img src="/favicon.svg" width="32" height="32" alt="">Clawd Tank</div>
    <a class="connection" id="connection" href="/connections" aria-label="View connections"><i></i><span>Connecting</span></a>
  </div></header>
  <main>
    <div class="heading"><h1>Pet habitat</h1><span id="session-count" aria-live="polite">Connecting…</span></div>
    <section class="tank" aria-label="Coding session habitat">
      <div class="glass" id="scene" role="group" aria-label="Tidepool">
        <img class="landscape" id="landscape" alt="" src="/art/habitat/tidal/scene">
        <div id="overflow" class="overflow" hidden><svg aria-hidden="true"><use href="#s-overflow"/></svg></div>
        <div class="occupants" id="occupants"></div>
      </div>
      <div class="controls">
        <div class="choices">
          <label><span>Character</span><select id="character" aria-label="Character"></select></label>
          <label><span>Habitat</span><select id="habitat" aria-label="Habitat"></select></label>
        </div>
        <details class="guide"><summary>Symbol guide</summary>
          <div class="guide-card"><h2>Pet signals</h2>
            <div><svg><use href="#s-question"/></svg>Needs an answer</div>
            <div><svg><use href="#s-approval"/></svg>Needs approval</div>
            <div><svg><use href="#s-failure"/></svg>Needs intervention</div>
            <div><svg><use href="#s-ready"/></svg>Turn ready</div>
            <div><svg><use href="#s-helpers"/></svg>Helpers active</div>
            <div><svg><use href="#s-overflow"/></svg>More sessions open</div>
          </div>
        </details>
      </div>
    </section>
    <p class="empty-help" id="empty-help" hidden>Waiting for a coding session. Connect your agents with <code>python host/habitat.py install-hooks</code>.</p>
    <noscript>Enable JavaScript to display live session activity.</noscript>
  </main>
</body>
</html>
